# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
min_version = 4.25.0
envlist =
    pre-commit
    pylint
    typing
    twinecheck
    docs
    min
    py{311-315}
    benchmark

[testenv]
deps =
    hypothesis >= 6.148.0
    pytest !=3.1.1, !=3.1.2
    pytest-cov >= 7.0.0
    pytest-xdist
commands =
    python -m pytest \
        --doctest-modules \
        --cov=w3lib --cov-report=term --cov-report=xml -n auto \
        {posargs:w3lib tests}

[testenv:min]
basepython = python3.11
deps =
    {[testenv]deps}
    frostwork==0.2.2

[testenv:typing]
basepython = python3
deps =
    pytest==9.1.1
    mypy==2.4.0
    hypothesis==6.168.3
commands =
    mypy {posargs: w3lib tests}

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint==4.1.2
commands =
    pylint docs tests w3lib

[testenv:docs]
changedir = docs
deps = -rdocs/requirements.txt
commands =
    sphinx-build -W -b html . {envtmpdir}/html

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.6.1
commands =
    python -m build --sdist
    twine check dist/*

[testenv:benchmark]
basepython = python3.13
deps =
    {[testenv]deps}
    pytest-codspeed
passenv =
    *codspeed*
    *ci*
commands =
    python -m pytest tests/benchmarks/ --no-cov --codspeed --codspeed-mode=simulation
